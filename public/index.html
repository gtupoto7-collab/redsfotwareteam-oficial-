<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RED SOFTWARE TEAM — FULL HD BUSINESS TEMPLATE ENGINE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hud-top">
    <div class="hud-wrap">
      <div class="hud-brand">
        <span class="hud-tag">RED SOFTWARE TEAM // BULGARIA</span>
        <strong>FULL HD BUSINESS &amp; VISUAL ENGINE</strong>
      </div>
      <div class="hud-actions">
        <button id="btnBoostVisual" class="btn-hud btn-hot" type="button">PODOBRI VIZIQTA (NEW VARIANT)</button>
        <button id="btnOneClickReady" class="btn-hud btn-cyan" type="button">ONE-CLICK READY</button>
        <button id="btnOpenLive" class="btn-hud" type="button">OTVORI NA JIVO</button>
        <button id="btnDownloadAll" class="btn-hud" type="button">SVALI PROEKTA</button>
      </div>
    </div>
  </header>

  <main class="hud-wrap hud-main">
    <section class="hud-panel">
      <div class="panel-bar">
        <h2>1. IZBERI BIZNES V BULGARIA &amp; BROTALEN SHABLON</h2>
        <span id="activeBadge" class="pill-live">FULL HD MODE</span>
      </div>

      <div id="bizTabs" class="biz-tabs"></div>

      <div class="controls-grid">
        <div>
          <label for="bizTitleInput">Ime na firmata / uslugata</label>
          <input id="bizTitleInput" type="text" placeholder="Napr. PUTNA MOSHT BULGARIA 24/7">
        </div>
        <div>
          <label for="bizCityInput">Region / grad v Bulgariq</label>
          <input id="bizCityInput" type="text" placeholder="Napr. Pernik, Sofiq, Magistrala Struma">
        </div>
        <div>
          <label for="paletteSelect">Cvetova viziq</label>
          <select id="paletteSelect">
            <option value="cyber-red">Cyber Red + Dark Grid</option>
            <option value="electric-cyan">Electric Cyan + Deep Space</option>
            <option value="toxic-emerald">Emerald Green + Carbon</option>
            <option value="royal-gold">Crimson &amp; Gold Command</option>
          </select>
        </div>
        <div>
          <label for="customPhotoUrl">Dobavi snimka za biznesa (URL ili izberi fail)</label>
          <div class="photo-row">
            <input id="customPhotoUrl" type="text" placeholder="https://... snimka">
            <input id="customPhotoFile" type="file" accept="image/*">
          </div>
        </div>
      </div>

      <div class="prompt-strip">
        <input id="promptBox" type="text" placeholder="Dopulnitelni opcii: napr. 24/7 repatrak, besplatna konsultaciq, onlain poruchki...">
        <button id="btnAddPhoto" class="btn-hud" type="button">+ KACHI SNIMKA</button>
      </div>

      <div id="statusMsg" class="hud-status"></div>
    </section>

    <section class="hud-split">
      <div class="hud-panel">
        <div class="panel-bar">
          <h2>2. BROTALNA FULL HD VIZIQ (LIVE PREVIEW)</h2>
          <span id="variantLabel" class="pill-sub">Variant #1</span>
        </div>
        <iframe id="liveFrame" class="fullhd-frame" title="Full HD Business Preview"></iframe>
      </div>

      <div class="hud-panel">
        <div class="panel-bar">
          <h2>3. KOD NA PROEKTA</h2>
          <div class="file-tabs">
            <button class="ftab active" data-f="index.html" type="button">index.html</button>
            <button class="ftab" data-f="style.css" type="button">style.css</button>
            <button class="ftab" data-f="app.js" type="button">app.js</button>
          </div>
        </div>
        <textarea id="codeBox" class="code-editor" spellcheck="false"></textarea>
        <div class="btn-row">
          <button id="btnApplyCode" class="btn-hud btn-cyan" type="button">PRILOJI KODA</button>
          <button id="btnDownloadFile" class="btn-hud" type="button">SVALI FAILA</button>
        </div>
      </div>
    </section>

    <section class="hud-panel" style="margin-top:18px;">
      <div class="panel-bar">
        <h2>4. ZAPITVANE / PORYCHKA</h2>
      </div>
      <form id="contactForm" class="c-form">
        <div class="c-row">
          <input id="cName" type="text" placeholder="Tvoyto ime" required>
          <input id="cEmail" type="email" placeholder="imeil@primer.com" required>
        </div>
        <textarea id="cMsg" placeholder="Kakuv sait i viziq iskash..." style="min-height:76px;" required></textarea>
        <button class="btn-hud btn-hot" type="submit">IZPRATI ZAPITVANE</button>
        <div id="cStatus" class="hud-status"></div>
      </form>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
