<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>RED SOFTWARE | Sound & Alert Box</title>
    <style>
        body { background-color: #0b0f19; color: #00ff66; font-family: 'Courier New', monospace; text-align: center; padding: 50px; }
        .box { border: 2px solid #00ff66; padding: 20px; display: inline-block; border-radius: 8px; box-shadow: 0 0 15px rgba(0, 255, 102, 0.3); }
        .status { color: #00ffff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🛡️ RED SOFTWARE SYSTEM & SOUNDBOX</h2>
        <p>Status: <span class="status">ONLINE [24/7 IDLE LOW]</span></p>
        <p>Active Sandbox Units: <span class="status">2,800 / Node</span></p>
        <p>Shield / Camouflage: <span class="status">ACTIVE (Sound Box Cover)</span></p>
        <hr style="border-color: #00ff66;">
        <audio id="audioStream" controls loop style="margin-top: 15px; width: 100%;">
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
            Вашият браузър не поддържа аудио елемента.
        </audio>
        <p style="font-size: 12px; color: #888; margin-top: 10px;">Keep-Alive Ping: Active & Silent</p>
    </div>

    <script>
        setInterval(() => {
            fetch('/ping').then(res => console.log('Keep-alive pulse sent.')).catch(err => console.log('Pulse quiet.'));
        }, 300000);
    </script>
</body>
</html>
