<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RED AUTO BUILDER AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div class="brand">RED AUTO BUILDER AI</div>
      <div class="view-switch">
        <button id="tabPreview" class="vtab active" type="button">LIVE PREVIEW</button>
        <button id="tabCode" class="vtab" type="button">CODE</button>
      </div>
      <span id="projTag" class="proj-tag">Няма проект</span>
    </div>
  </header>

  <main class="wrap main">
    <!-- GENERATE -->
    <section class="gen-box">
      <label for="promptInput">Какво искаш да създадеш?</label>
      <div class="gen-row">
        <input id="promptInput" type="text" placeholder="Искам професионален сайт за AI компания">
        <button id="btnGenerate" class="btn-go" type="button">GENERATE</button>
      </div>
      <div id="statusLine" class="status-line">Въведи описание и натисни GENERATE.</div>
    </section>

    <!-- PAGES + LIVE PREVIEW / CODE -->
    <section class="stage-grid">
      <aside class="pages-col">
        <div class="col-title">PAGES</div>
        <div id="pagesList" class="pages-list">
          <button class="page-btn active" data-page="home" type="button">Home</button>
          <button class="page-btn" data-page="about" type="button">About</button>
          <button class="page-btn" data-page="services" type="button">Services</button>
          <button class="page-btn" data-page="pricing" type="button">Pricing</button>
          <button class="page-btn" data-page="contact" type="button">Contact</button>
        </div>
      </aside>

      <div class="center-col">
        <iframe id="previewFrame" class="preview-frame" title="Live Preview"></iframe>

        <div id="codeDrawer" class="code-drawer" style="display:none;">
          <div class="code-top">
            <select id="fileSelect"></select>
            <button id="btnSaveFile" class="btn-mini" type="button">Запази</button>
          </div>
          <textarea id="codeEditor" spellcheck="false"></textarea>
        </div>
      </div>
    </section>

    <!-- EDIT WITH AI + PUBLISH -->
    <section class="edit-bar">
      <div class="ai-cmd-row">
        <input id="aiCmdInput" type="text" placeholder="Напр.: Направи header-а по-премиум и добави pricing page">
        <button id="btnAiCmd" class="btn-mini primary" type="button">EDIT WITH AI</button>
      </div>

      <div class="quick-row">
        <button class="btn-mini" data-act="MAKE PREMIUM" type="button">Improve</button>
        <button class="btn-mini" data-act="ADD PAGE" type="button">Add Page</button>
        <button class="btn-mini" data-act="REDESIGN" type="button">Redesign</button>
        <button class="btn-mini" data-act="FIX BUGS" type="button">Fix</button>
        <button id="btnPublish" class="btn-mini publish" type="button">Publish</button>
      </div>

      <div id="publishOut" class="publish-out"></div>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
